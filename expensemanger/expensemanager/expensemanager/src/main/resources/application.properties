spring.application.name=expensemanager

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Receipt upload folder
app.receipt.upload-dir=uploads/receipts

# Tesseract OCR
app.tesseract.data-path=${TESSDATA_PATH:/usr/share/tesseract-ocr/5/tessdata}
app.tesseract.language=eng

# Frontend URL for CORS
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Groq API
groq.api.key=${GROQ_API_KEY}
groq.api.base-url=https://api.groq.com/openai/v1
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=meta-llama/llama-4-scout-17b-16e-instruct
groq.model=llama-3.1-8b-instant

# Gemini dummy config
gemini.api.key=dummy
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-2.0-flash